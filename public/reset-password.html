<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChatBot AI — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0F172A;
  --surface:#1E293B;
  --surface2:#263347;
  --accent:#6366F1;
  --accent-h:#818CF8;
  --accent-d:#4F46E5;
  --text:#F1F5F9;
  --muted:#94A3B8;
  --border:rgba(99,102,241,0.28);
  --err:#F87171;
  --ok:#34D399;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:1.5rem;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}

body::before{
  content:'';position:fixed;top:-10%;left:50%;transform:translateX(-50%);
  width:800px;height:600px;
  background:radial-gradient(ellipse at center,rgba(99,102,241,0.14) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(99,102,241,0.13) 1px,transparent 1px);
  background-size:32px 32px;pointer-events:none;z-index:0;
}

.auth-wrapper{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  margin:auto;
  padding:1.5rem 0;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2.4rem 2.2rem 2rem;
  box-shadow:0 0 0 1px rgba(99,102,241,0.07),0 28px 64px rgba(0,0,0,0.55);
}

.bot-wrap{display:flex;justify-content:center;margin-bottom:1.4rem;}
.bot-ring{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,#4F46E5 0%,#818CF8 100%);
  display:flex;align-items:center;justify-content:center;
  animation:float 3.5s ease-in-out infinite;
  box-shadow:0 0 0 8px rgba(99,102,241,0.11),0 0 28px rgba(99,102,241,0.28);
}
.bot-ring .material-symbols-outlined{font-size:34px;color:#fff;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.card-title{text-align:center;font-size:1.42rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:.35rem;}
.card-sub{text-align:center;font-size:0.855rem;color:var(--muted);margin-bottom:1.7rem;}

.field{margin-bottom:.9rem;}
.field label{
  display:block;font-size:0.76rem;font-weight:600;
  color:var(--muted);margin-bottom:.42rem;
  letter-spacing:.05em;text-transform:uppercase;
}
.input-wrap{position:relative;}
.input-wrap .icon-left{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:17px;color:var(--muted);pointer-events:none;transition:color .2s;
}
.input-wrap input{
  width:100%;padding:.7rem 2.5rem .7rem 2.5rem;
  background:var(--bg);border:1px solid rgba(255,255,255,0.09);
  border-radius:10px;color:var(--text);
  font-size:0.88rem;font-family:'Inter',sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.input-wrap input::placeholder{color:#475569;}
.input-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,0.17);}
.input-wrap input:focus~.icon-left{color:var(--accent-h);}

.eye-btn{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:2px;display:flex;align-items:center;
}
.eye-btn:hover{color:var(--text);}
.eye-btn .material-symbols-outlined{font-size:17px;}

.btn-primary{
  width:100%;padding:.76rem 1rem;border:none;border-radius:10px;
  background:var(--accent);color:#fff;
  font-size:0.93rem;font-weight:600;font-family:'Inter',sans-serif;
  cursor:pointer;letter-spacing:.01em;
  transition:background .2s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:1.2rem;
}
.btn-primary:hover{background:var(--accent-d);}
.btn-primary:active{transform:scale(0.98);}

.msg{
  display:none;border-radius:8px;font-size:0.8rem;
  padding:.55rem .85rem;margin-bottom:.9rem;text-align:center;
  word-break:break-word;
}
.msg.show{display:block;}
.msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.28);color:var(--err);}
.msg.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.28);color:var(--ok);}

.success-overlay{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:1rem 0 .5rem;
}
.success-overlay.show{display:flex;}
.success-circle{
  width:64px;height:64px;border-radius:50%;
  background:rgba(52,211,153,0.15);border:2px solid var(--ok);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:1.1rem;animation:pop .35s ease;
}
.success-circle .material-symbols-outlined{font-size:32px;color:var(--ok);}
@keyframes pop{0%{transform:scale(0.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
.success-title{font-size:1.2rem;font-weight:700;margin-bottom:.4rem;}
.success-sub{font-size:0.85rem;color:var(--muted);}

.switch-row{
  text-align:center;margin-top:1.3rem;
  font-size:0.83rem;color:var(--muted);
}
.switch-row a{
  color:var(--accent-h);text-decoration:none;font-weight:600;
  transition:color .2s;cursor:pointer;
}
.switch-row a:hover{color:#a5b4fc;}
</style>
</head>
<body>

<div class="auth-wrapper">
<div class="card" id="resetCard">

  <div class="bot-wrap">
    <div class="bot-ring" aria-hidden="true">
      <span class="material-symbols-outlined">lock_open</span>
    </div>
  </div>

  <h1 class="card-title" id="rpTitle">Set new password</h1>
  <p class="card-sub" id="rpSub">Create a secure password to protect your account</p>

  <div class="msg error" id="rpError" role="alert"></div>

  <!-- success state -->
  <div class="success-overlay" id="rpSuccess">
    <div class="success-circle">
      <span class="material-symbols-outlined">check</span>
    </div>
    <p class="success-title">Password updated!</p>
    <p class="success-sub">Redirecting you to the login page...</p>
  </div>

  <form id="resetForm" novalidate>
    <div class="field">
      <label for="rpPass">New Password</label>
      <div class="input-wrap">
        <input type="password" id="rpPass" placeholder="Enter new password" required minlength="6"/>
        <span class="material-symbols-outlined icon-left" aria-hidden="true">lock</span>
        <button type="button" class="eye-btn" onclick="toggleEye('rpPass','rpEye')" aria-label="Toggle password">
          <span class="material-symbols-outlined" id="rpEye">visibility</span>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="rpPassC">Confirm New Password</label>
      <div class="input-wrap">
        <input type="password" id="rpPassC" placeholder="Confirm new password" required/>
        <span class="material-symbols-outlined icon-left" aria-hidden="true">lock_reset</span>
        <button type="button" class="eye-btn" onclick="toggleEye('rpPassC','rpEyeC')" aria-label="Toggle password">
          <span class="material-symbols-outlined" id="rpEyeC">visibility</span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary">
      Save password
    </button>
  </form>

  <p class="switch-row" id="rpSwitchRow">Back to <a onclick="goToLogin()">Sign in</a></p>

</div><!-- /card -->
</div><!-- /auth-wrapper -->

<!-- Supabase and Local Helper Configuration -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="auth.js"></script>

<script>
// Check recovery session on page load
window.addEventListener('DOMContentLoaded', async () => {
  const url = window.SUPABASE_URL;
  const key = window.SUPABASE_ANON_KEY;
  if (typeof window.supabase === 'undefined' || !url || !key || url === 'YOUR_SUPABASE_PROJECT_URL' || key === 'YOUR_SUPABASE_ANON_KEY' || url === '' || key === '') {
    showInvalidState("Supabase credentials are not configured. Please set SUPABASE_URL and SUPABASE_ANON_KEY in your .env file.");
    return;
  }

  try {
    const session = await AuthService.getCurrentSession();
    // In Supabase, password recovery redirection sets an active session.
    // If there is no active session, the recovery token in the URL hash is invalid or expired.
    if (!session) {
      showInvalidState("Invalid or expired password reset session. Please request a new recovery link.");
    }
  } catch (err) {
    showInvalidState("Connection error. Could not verify your recovery session.");
  }
});

function showInvalidState(message) {
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('rpSub').style.display = 'none';
  document.getElementById('rpTitle').textContent = 'Link Expired';
  showMsg('rpError', message);
}

function goToLogin() {
  window.location.href = 'login-page.html';
}

function toggleEye(inputId, iconId){
  const inp  = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  icon.textContent = show ? 'visibility_off' : 'visibility';
}

function showMsg(id, text, type='error'){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function clearMsg(id){
  const el = document.getElementById(id);
  el.className = 'msg';
}

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  clearMsg('rpError');

  const pass  = document.getElementById('rpPass').value;
  const passC = document.getElementById('rpPassC').value;

  if(!pass || !passC){ showMsg('rpError', 'Please fill in all fields.'); return; }
  if(pass.length < 6){ showMsg('rpError', 'Password must be at least 6 characters.'); return; }
  if(pass !== passC){ showMsg('rpError', 'Passwords do not match.'); return; }

  try {
    await AuthService.resetPassword(pass);
    
    // Hide reset form
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('rpSub').style.display = 'none';
    document.getElementById('rpSwitchRow').style.display = 'none';
    
    // Show success overlay
    document.getElementById('rpSuccess').classList.add('show');
    
    // Redirect after 3 seconds
    setTimeout(() => { goToLogin(); }, 3000);
  } catch (err) {
    showMsg('rpError', err.message || 'Failed to update password.');
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="feedback_style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>Chatter AI</h1>
        <h3>Feedback Form</h3>
        <div class="content">
            
            <div class="form">
                    <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1">@</span>
                    <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1" required>
                </div>
                <!-- Email input -->
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="you@awesome.com" aria-label="Recipient's username" aria-describedby="basic-addon2" required>
                    <span class="input-group-text" id="basic-addon2">@example.com</span>
                </div>
            
            </div>
            <!-- Radio Button -->
            <div class="radio">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                    <label class="form-check-label" for="flexRadioDefault2">
                    General Feedback
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                    <label class="form-check-label" for="flexRadioDefault1">
                    Techinical Feedback
                    </label>
                </div>
                
            </div>
            <!-- Text Area -->
            <div class="feedback">
                <div class="input-group">
                    <span class="input-group-text">Your Feedback</span>
                    <textarea class="form-control" aria-label="With textarea" style="height: 90px;"></textarea>
                </div>
            </div>
            <!-- Terms & Condition -->
            <div class="check">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">
                        I accept terms and conditions
                    </label>
                </div>
            </div>
            <!-- Button -->
            <div class="button">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button" onclick="clearForm()">Submit</button>
                </div>
            </div>
        </div>
        
    </div>
    <script src="feedback_script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>    
    
   </body>
</html>
